<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="100%" height="100%">
  <defs>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
  </defs>

  <rect width="794" height="1123" fill="#ffffff" />
  
  <!-- Outer Emerald Border -->
  <rect x="24" y="24" width="746" height="1075" fill="none" stroke="url(#emerald)" stroke-width="4.5" />
  <rect x="32" y="32" width="730" height="1059" fill="none" stroke="#10b981" stroke-width="1.5" />
  <rect x="40" y="40" width="714" height="1043" fill="none" stroke="url(#emerald)" stroke-width="1" />

  <!-- Corner Accents (TL) -->
  <g transform="translate(40, 40)" fill="url(#emerald)">
    <rect x="0" y="0" width="30" height="4" />
    <rect x="0" y="0" width="4" height="30" />
    <circle cx="15" cy="15" r="4" fill="#047857" />
  </g>

  <!-- TR -->
  <g transform="translate(754, 40) scale(-1, 1)" fill="url(#emerald)">
    <rect x="0" y="0" width="30" height="4" />
    <rect x="0" y="0" width="4" height="30" />
    <circle cx="15" cy="15" r="4" fill="#047857" />
  </g>

  <!-- BL -->
  <g transform="translate(40, 1083) scale(1, -1)" fill="url(#emerald)">
    <rect x="0" y="0" width="30" height="4" />
    <rect x="0" y="0" width="4" height="30" />
    <circle cx="15" cy="15" r="4" fill="#047857" />
  </g>

  <!-- BR -->
  <g transform="translate(754, 1083) scale(-1, -1)" fill="url(#emerald)">
    <rect x="0" y="0" width="30" height="4" />
    <rect x="0" y="0" width="4" height="30" />
    <circle cx="15" cy="15" r="4" fill="#047857" />
  </g>
</svg>
