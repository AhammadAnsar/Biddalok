<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bf953f" />
      <stop offset="25%" stop-color="#fcf6ba" />
      <stop offset="50%" stop-color="#b38728" />
      <stop offset="75%" stop-color="#fbf5b7" />
      <stop offset="100%" stop-color="#aa771c" />
    </linearGradient>
    <linearGradient id="navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <pattern id="guilloche" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 Q 10 0, 20 20 T 40 20" fill="none" stroke="#bf953f" stroke-width="0.5" opacity="0.15"/>
      <path d="M0 20 Q 10 40, 20 20 T 40 20" fill="none" stroke="#1e3a8a" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="794" height="1123" fill="#ffffff" />
  
  <!-- Subtle Border Pattern -->
  <rect x="25" y="25" width="744" height="1073" fill="url(#guilloche)" opacity="0.4" />
  <rect x="35" y="35" width="724" height="1053" fill="#ffffff" />

  <!-- Outer Navy Frame -->
  <rect x="20" y="20" width="754" height="1083" fill="none" stroke="url(#navy)" stroke-width="6" rx="4" />
  
  <!-- Gold Accent Inner -->
  <rect x="28" y="28" width="738" height="1067" fill="none" stroke="url(#gold)" stroke-width="2.5" />
  
  <!-- Thin Navy Inner Border -->
  <rect x="38" y="38" width="718" height="1047" fill="none" stroke="#1e3a8a" stroke-width="1" />

  <!-- Corner Ornaments (Top Left) -->
  <g transform="translate(38, 38)">
    <path d="M 0,0 L 50,0 L 50,6 L 6,6 L 6,50 L 0,50 Z" fill="url(#gold)" />
    <circle cx="20" cy="20" r="4" fill="url(#navy)" />
    <path d="M 8,8 L 35,8 L 8,35 Z" fill="url(#navy)" opacity="0.2"/>
  </g>
  
  <!-- Top Right -->
  <g transform="translate(756, 38) scale(-1, 1)">
    <path d="M 0,0 L 50,0 L 50,6 L 6,6 L 6,50 L 0,50 Z" fill="url(#gold)" />
    <circle cx="20" cy="20" r="4" fill="url(#navy)" />
    <path d="M 8,8 L 35,8 L 8,35 Z" fill="url(#navy)" opacity="0.2"/>
  </g>

  <!-- Bottom Left -->
  <g transform="translate(38, 1085) scale(1, -1)">
    <path d="M 0,0 L 50,0 L 50,6 L 6,6 L 6,50 L 0,50 Z" fill="url(#gold)" />
    <circle cx="20" cy="20" r="4" fill="url(#navy)" />
    <path d="M 8,8 L 35,8 L 8,35 Z" fill="url(#navy)" opacity="0.2"/>
  </g>

  <!-- Bottom Right -->
  <g transform="translate(756, 1085) scale(-1, -1)">
    <path d="M 0,0 L 50,0 L 50,6 L 6,6 L 6,50 L 0,50 Z" fill="url(#gold)" />
    <circle cx="20" cy="20" r="4" fill="url(#navy)" />
    <path d="M 8,8 L 35,8 L 8,35 Z" fill="url(#navy)" opacity="0.2"/>
  </g>
</svg>
