<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Biddalok Official Crest Logo -->
  <defs>
    <style>
      .green-fill { fill: #0d6945; }
      .navy-fill { fill: #132738; }
      .sun-fill { fill: #e5a912; }
      .white-fill { fill: #ffffff; }
      .green-stroke { stroke: #0d6945; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Top Dark Navy Dot -->
  <circle cx="256" cy="42" r="21" class="navy-fill" />

  <!-- Shield Top Border and Frame -->
  <path d="M 256,76 
           C 278,92 312,106 394,110
           L 394,272
           C 394,272 380,272 376,272
           L 376,128
           C 310,125 280,112 256,96
           C 232,112 202,125 136,128
           L 136,272
           C 132,272 118,272 118,272
           L 118,110
           C 200,106 234,92 256,76 Z" 
        class="green-fill" />

  <!-- Outer Circular Shield Wings (Bottom Arc) -->
  <path d="M 103,170
           C 74,235 78,322 126,388
           C 162,438 214,472 256,478
           C 298,472 350,438 386,388
           C 434,322 438,235 409,170
           C 426,238 418,324 374,386
           C 336,440 286,470 256,472
           C 226,470 176,440 138,386
           C 94,324 86,238 103,170 Z" 
        class="green-fill" />

  <!-- Center Rising Sun Dome -->
  <path d="M 182,305 
           C 182,230 215,190 256,190 
           C 297,190 330,230 330,305 
           Z" 
        class="sun-fill" />

  <!-- Sun Rays -->
  <!-- Top Ray (vertical) -->
  <rect x="251" y="112" width="10" height="66" rx="5" class="sun-fill" />

  <!-- Ray at ~22.5 deg -->
  <rect x="251" y="116" width="9" height="52" rx="4.5" class="sun-fill" transform="rotate(28 256 270)" />
  <!-- Ray at ~55 deg -->
  <rect x="251" y="118" width="9" height="48" rx="4.5" class="sun-fill" transform="rotate(56 256 270)" />
  <!-- Ray at ~80 deg -->
  <rect x="251" y="122" width="9" height="42" rx="4.5" class="sun-fill" transform="rotate(82 256 270)" />

  <!-- Left symmetric rays -->
  <rect x="251" y="116" width="9" height="52" rx="4.5" class="sun-fill" transform="rotate(-28 256 270)" />
  <rect x="251" y="118" width="9" height="48" rx="4.5" class="sun-fill" transform="rotate(-56 256 270)" />
  <rect x="251" y="122" width="9" height="42" rx="4.5" class="sun-fill" transform="rotate(-82 256 270)" />

  <!-- Open Book / Wing Feathers (Dark Navy Blue) -->
  <!-- Top Layer Wings -->
  <path d="M 256,380 
           C 220,326 150,304 100,308
           C 98,318 97,328 98,336
           C 145,324 214,342 256,380 Z" 
        class="navy-fill" />
  <path d="M 256,380 
           C 292,326 362,304 412,308
           C 414,318 415,328 414,336
           C 367,324 298,342 256,380 Z" 
        class="navy-fill" />

  <!-- Middle Layer Wings -->
  <path d="M 256,410 
           C 224,364 165,348 112,352
           C 114,363 118,373 124,382
           C 168,368 222,382 256,410 Z" 
        class="navy-fill" />
  <path d="M 256,410 
           C 288,364 347,348 400,352
           C 398,363 394,373 388,382
           C 344,368 290,382 256,410 Z" 
        class="navy-fill" />

  <!-- Bottom Layer Wings (meeting at base) -->
  <path d="M 256,448 
           C 230,410 185,396 142,398
           C 152,414 168,430 188,442
           C 214,435 240,442 256,448 Z" 
        class="navy-fill" />
  <path d="M 256,448 
           C 282,410 327,396 370,398
           C 360,414 344,430 324,442
           C 298,435 272,442 256,448 Z" 
        class="navy-fill" />

  <!-- Central Pen Nib (Fountain Pen) -->
  <!-- Outer Nib Body (Green) -->
  <path d="M 256,236 
           L 292,274 
           L 282,342 
           L 256,396 
           L 230,342 
           L 220,274 Z" 
        class="green-fill" />

  <!-- Pen Nib Inner White Contour & Slit -->
  <!-- Left Inner Wing -->
  <path d="M 253,248 
           L 229,278 
           L 238,336 
           L 253,382 
           Z" 
        class="green-fill" />
  <!-- Right Inner Wing -->
  <path d="M 259,248 
           L 283,278 
           L 274,336 
           L 259,382 
           Z" 
        class="green-fill" />

  <!-- Pen Center Slit (Vertical White Line) -->
  <line x1="256" y1="242" x2="256" y2="392" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />

  <!-- Breather Hole (White Circle) -->
  <circle cx="256" cy="318" r="11" class="white-fill" />

  <!-- Bottom Crest Connector Chevron (Green & White) -->
  <path d="M 256,464 
           L 218,422 
           L 226,412 
           L 256,446 
           L 286,412 
           L 294,422 Z" 
        class="white-fill" />
  <path d="M 256,472 
           L 210,422 
           L 218,414 
           L 256,456 
           L 294,414 
           L 302,422 Z" 
        class="green-fill" />
</svg>
